name: Review YouTube upstream candidate

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused checks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/protection.test.js
      - name: Download and validate latest upstream as a candidate
        run: python3 scripts/update_youtube.py --output /tmp/youtube-candidate
      - name: Record review diff
        run: |
          for file in youtube.sgmodule youtube.response.js youtube.request.js youtube.upstream.json; do
            if [ -f "$file" ]; then
              git diff --no-index -- "$file" "/tmp/youtube-candidate/$file" > "/tmp/youtube-candidate/$file.diff" || test "$?" -eq 1
            fi
          done
          printf '%s\n' 'Validated candidate attached. Review the diff and device-test before promoting to stable; this workflow does not commit or push.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-reviewed-candidate
          path: /tmp/youtube-candidate/
